  <circle cx="382" cy="352" r="14" fill="#8B7FC9" fill-opacity="0.55"/>

  <!-- compound node: outer ring -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#F5B740" stroke-width="14"/>

  <!-- nested sub-graph inside the ring -->
  <line x1="256" y1="212" x2="212" y2="288" stroke="#E9E4FF" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="212" x2="300" y2="288" stroke="#E9E4FF" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round"/>
  <line x1="212" y1="288" x2="300" y2="288" stroke="#E9E4FF" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round"/>

  <circle cx="256" cy="212" r="26" fill="#F5B740"/>
