<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17213E"/>
      <stop offset="100%" stop-color="#3E2E73"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#5B4A9E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5B4A9E" stop-opacity="0"/>
