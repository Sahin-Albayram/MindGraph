  <circle cx="256" cy="216" r="180" fill="url(#glow)"/>

  <!-- outer link stubs hinting at the wider graph -->
  <line x1="256" y1="256" x2="130" y2="352" stroke="#8B7FC9" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="382" y2="352" stroke="#8B7FC9" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
